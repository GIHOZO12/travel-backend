# CD = Continuous Delivery: once code is on `main` (or a version is tagged),
# run all the CI checks again and, if they pass, publish the Docker image to
# Docker Hub automatically.
#
# Needs (Settings → Secrets and variables → Actions):
#   Variables tab → DOCKERHUB_USERNAME  your Docker Hub username
#   Secrets tab   → DOCKERHUB_TOKEN     a Docker Hub access token (Read & Write)
#
# What gets published to <username>/travel-tour-api:
#   push to main      → :latest  and  :sha-<commit>
#   push tag v1.2.3   → :1.2.3   and  :1.2   and  :sha-<commit>

name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Docker image
    needs: ci # only runs if every CI job passed
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # QEMU + Buildx let one runner build images for several CPU types.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub passes an EMPTY value (no error) for a missing variable/secret,
      # which only fails later as a vague login error — so check up front.
      - name: Check Docker Hub settings
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Repository VARIABLE DOCKERHUB_USERNAME is not set (Settings → Secrets and variables → Actions → Variables tab)"
            missing=1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Repository SECRET DOCKERHUB_TOKEN is not set (Settings → Secrets and variables → Actions → Secrets tab)"
            missing=1
          fi
          exit $missing

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Works out the image tags from the branch / git tag (see the list at the top).
      - name: Decide image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/travel-tour-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 = most servers/PCs, arm64 = AWS Graviton, Raspberry Pi, Apple Silicon
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
