# Runs the whole backend with one command: `docker compose up -d --build`
#   db  — PostgreSQL, data kept in the `db-data` volume
#   api — this project, built from the Dockerfile
#
# Values like ${POSTGRES_PASSWORD} are read from the .env file next to this one.
# See DOCKER.md for the full step-by-step guide.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-travel_tour}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Host port 5433 (not 5432) so it doesn't clash with a PostgreSQL already
    # installed on your computer. Inside Docker the api still uses db:5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_tour}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # The name (and version tag) the built image gets. Set API_IMAGE in .env to
    # your registry name, e.g. API_IMAGE=yourname/travel-tour-api:1.0.0, so that
    # `docker compose push api` can publish it (DOCKER.md, Part 7).
    image: ${API_IMAGE:-travel-tour-api:latest}
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    # Every variable from .env (JWT_SECRET, SMTP_*, CLIENT_URL, ...) ...
    env_file: .env
    # ... except these, which are overridden for the container. DATABASE_URL
    # uses the host name `db` — the service above — instead of localhost.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travel_tour}
      NODE_ENV: production
      PORT: 5000
    # host:container — open http://localhost:5000. Set API_PORT in .env to use
    # another host port (e.g. while `npm run dev` already holds 5000).
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
    # Wait until PostgreSQL actually accepts connections, not just "started".
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
